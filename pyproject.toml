[project]
name = "shanghui-recommend"
version = "1.0.0"
description = "个性化推题服务：掌握度读时衰减 + 推荐召回"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "pydantic>=2.5",
    "pydantic-settings>=2",
    "numpy",
    "psycopg2-binary",
    "python-dotenv",
]

[project.optional-dependencies]
# httpx<0.28：fastapi 0.104 自带的 starlette TestClient 与 httpx≥0.28 不兼容
dev = ["pytest>=7", "httpx>=0.25,<0.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
